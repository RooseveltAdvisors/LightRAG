# LightRAG Production Docker Compose Stack
# Core services: PostgreSQL, Neo4j, Redis, LightRAG
# Data directory: /data/claraly/rag

version: '3.8'

services:
  # PostgreSQL with pgvector for vector storage
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lightrag-postgres
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: '4'
        reservations:
          memory: 8G
          cpus: '2'
    environment:
      POSTGRES_DB: lightrag
      POSTGRES_USER: lightrag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - /data/claraly/rag/postgres/data:/var/lib/postgresql/data
      - /data/claraly/rag/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5433:5432"
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
      -c shared_buffers=8GB
      -c effective_cache_size=24GB
      -c maintenance_work_mem=2GB
      -c work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_parallel_workers=4
      -c max_parallel_workers_per_gather=2
      -c max_worker_processes=8
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightrag -d lightrag"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Neo4j for knowledge graph storage
  neo4j:
    image: neo4j:5.23-community
    container_name: lightrag-neo4j
    deploy:
      resources:
        limits:
          memory: 36G
          cpus: '4'
        reservations:
          memory: 20G
          cpus: '2'
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_memory_heap_initial__size: 4G
      NEO4J_dbms_memory_heap_max__size: 16G
      NEO4J_dbms_memory_pagecache_size: 20G
      NEO4J_dbms_memory_transaction_total_max: 2G
      NEO4J_dbms_default__database: lightrag
    volumes:
      - /data/claraly/rag/neo4j/data:/data
      - /data/claraly/rag/neo4j/logs:/logs
      - /data/claraly/rag/neo4j/import:/var/lib/neo4j/import
      - /data/claraly/rag/neo4j/plugins:/plugins
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Redis for caching and session storage
  redis:
    image: redis:7.2-alpine
    container_name: lightrag-redis
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '1'
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --save 900 1 --save 300 10 --save 60 1000 --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
      - /data/claraly/rag/redis/data:/data
    ports:
      - "6380:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # LightRAG Application
  lightrag:
    container_name: lightrag
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - ghcr.io/hkuds/lightrag:latest
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${PORT:-9621}:9621"
    volumes:
      - /data/claraly/rag/lightrag:/data/claraly/rag/data/rag_storage
      - /data/claraly/rag/inputs:/data/claraly/rag/data/inputs
      - /data/claraly/rag/tiktoken:/data/claraly/rag/data/tiktoken
      - ./config.ini:/data/claraly/rag/config.ini
      - ./.env:/data/claraly/rag/.env
    env_file:
      - .env
    environment:
      # Storage Configuration
      - LIGHTRAG_KV_STORAGE=PGKVStorage
      - LIGHTRAG_VECTOR_STORAGE=PGVectorStorage
      - LIGHTRAG_GRAPH_STORAGE=Neo4JStorage
      - LIGHTRAG_DOC_STATUS_STORAGE=PGDocStatusStorage

      # Database Connections
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=lightrag
      - POSTGRES_USER=lightrag
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=lightrag

      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0

      - TIKTOKEN_CACHE_DIR=/data/claraly/rag/data/tiktoken

      # Application Settings
      - WORKSPACE=${WORKSPACE}
      - MAX_ASYNC=2
      - MAX_PARALLEL_INSERT=1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9621/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # LightRAG MCP Server for Claude Code (stdio via docker exec)
  lightrag-mcp:
    container_name: lightrag-mcp
    build:
      context: .
      dockerfile: Dockerfile.mcp
    image: lightrag-mcp:latest
    depends_on:
      lightrag:
        condition: service_healthy
    volumes:
      - /data/claraly/rag/lightrag:/data/lightrag_data
    env_file:
      - .env
    environment:
      - WORKSPACE=${WORKSPACE}
      - LIGHTRAG_WORKING_DIR=/data/lightrag_data
      - LIGHTRAG_LLM_MODEL=${LLM_MODEL}
      - LIGHTRAG_LLM_HOST=${LLM_BINDING_HOST}
      - LIGHTRAG_EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - LIGHTRAG_EMBEDDING_HOST=${EMBEDDING_BINDING_HOST}
      - LIGHTRAG_EMBEDDING_DIM=${EMBEDDING_DIM}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python3", "-c", "import mcp, lightrag"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

# Named volumes for easier management
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/claraly/rag/postgres/data

  neo4j_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/claraly/rag/neo4j/data

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/claraly/rag/redis/data

networks:
  default:
    name: lightrag-network
    driver: bridge